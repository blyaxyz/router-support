<VirtualHost *:80>
    ServerName SUPPORT_HOSTNAME
    ServerAlias *.SUPPORT_HOSTNAME

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ProxyPreserveHost On
    ProxyAddHeaders On
    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/router-support-acme/.well-known/acme-challenge/
    <Directory /var/www/router-support-acme/.well-known/acme-challenge/>
        Require all granted
    </Directory>
    ProxyPass /api/terminal/ ws://127.0.0.1:8000/api/terminal/
    ProxyPassReverse /api/terminal/ ws://127.0.0.1:8000/api/terminal/
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/router-support-error.log
    CustomLog ${APACHE_LOG_DIR}/router-support-access.log combined
</VirtualHost>
