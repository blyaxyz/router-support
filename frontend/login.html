<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Router Support</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07111f; color: #eef6ff; }
    main { width: min(92vw, 430px); padding: 2rem; border: 1px solid #21334a; border-radius: 18px; background: #0d1b2d; box-shadow: 0 24px 70px #0008; }
    p { color: #9eb1c8; line-height: 1.5; }
    label { display: block; margin: 1.5rem 0 .5rem; }
    input, button { width: 100%; min-height: 46px; border-radius: 10px; font: inherit; }
    input { border: 1px solid #38506d; padding: 0 .8rem; background: #07111f; color: inherit; }
    button { margin-top: 1rem; border: 0; background: #42c8f5; color: #04101d; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #error { min-height: 1.5em; color: #ff8c8c; }
  </style>
</head>
<body>
  <main>
    <h1>Router Support</h1>
    <p>Введите инженерный токен доступа, полученный после установки сервера.</p>
    <form id="login-form">
      <label for="token">Инженерный токен</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Войти</button>
      <p id="error" role="alert"></p>
    </form>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
